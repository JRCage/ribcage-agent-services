name: ContactWatch offline tests
on:
  push:
    paths:
      - 'community/contact-watch/**'
      - '.github/workflows/contact-watch-tests.yml'
  pull_request:
    paths:
      - 'community/contact-watch/**'
      - '.github/workflows/contact-watch-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s community/contact-watch -p 'test_*.py' -v
