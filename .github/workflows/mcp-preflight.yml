name: MCP Preflight tests
on:
  push:
    paths:
      - 'mcp-preflight/**'
      - '.github/workflows/mcp-preflight.yml'
  pull_request:
    paths:
      - 'mcp-preflight/**'
      - '.github/workflows/mcp-preflight.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node mcp-preflight/run-tests.mjs
